<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idioms Quiz — Английские идиомы</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0; padding: 20px;
        }
        .container {
            max-width: 720px; margin: 0 auto;
            background: white; padding: 36px;
            border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        h1 { margin: 0 0 8px; color: #1a1a1a; font-size: 1.7rem; }
        .intro { color: #666; margin-bottom: 24px; line-height: 1.5; }
        .name-input {
            width: 100%; padding: 12px 14px; font-size: 1rem;
            border: 2px solid #e0e0e0; border-radius: 8px;
            margin-bottom: 24px; font-family: inherit;
        }
        .name-input:focus { outline: none; border-color: #667eea; }
        fieldset {
            border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 16px 20px; margin-bottom: 14px;
        }
        legend { font-weight: 700; padding: 0 8px; color: #333; }
        .option {
            display: flex; gap: 10px; align-items: center;
            padding: 8px 0; cursor: pointer; font-size: 0.97rem;
        }
        .option:hover { color: #667eea; }
        .option input { cursor: pointer; }
        #submitBtn {
            width: 100%; padding: 14px; font-size: 1rem;
            background: #667eea; color: white; border: none;
            border-radius: 10px; cursor: pointer;
            font-weight: 700; margin-top: 10px;
        }
        #submitBtn:hover:not(:disabled) { background: #5568d3; }
        #submitBtn:disabled { opacity: 0.6; cursor: wait; }
        #result {
            margin-top: 20px; padding: 16px;
            border-radius: 10px; text-align: center;
            font-size: 1.05rem; display: none;
        }
        #result.success { background: #e8f5e9; color: #2e7d32; display: block; }
        #result.error { background: #ffebee; color: #c62828; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Idioms Quiz</h1>
        <p class="intro">
            Проверьте, как хорошо вы понимаете английские идиомы,
            которые часто звучат в фильмах и сериалах. 10 вопросов — 10 идиом.
        </p>

        <input type="text" id="studentName" class="name-input"
               placeholder="Ваше имя" required maxlength="80">

        <form id="quizForm"></form>

        <button id="submitBtn" type="submit" form="quizForm">Завершить тест</button>
        <div id="result"></div>
    </div>

    <script>
        // Ваша ссылка уже вставлена сюда:
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4t8RaI9_tC-Ri6KE-iAlZ_FVwQ0py-FlE7mTg-5ar5BKjZN973ml0pe1UYt2lcsWV/exec";

        const questions = [
            {
                q: "Что означает идиома «break a leg»?",
                options: ["Сломать ногу", "Пожелание удачи", "Сделать ошибку"],
                correct: 1
            },
            {
                q: "«It's a piece of cake» переводится как…",
                options: ["Это кусок торта", "Это очень просто", "Это подарок"],
                correct: 1
            },
            {
                q: "Что значит «hit the books»?",
                options: ["Ударить книгу", "Начать усердно учиться", "Сходить в библиотеку"],
                correct: 1
            },
            {
                q: "Если человек «under the weather», он…",
                options: ["Под дождём", "Плохо себя чувствует", "В плохом настроении"],
                correct: 1
            },
            {
                q: "«Once in a blue moon» означает…",
                options: ["Очень редко", "Каждую ночь", "Никогда"],
                correct: 0
            },
            {
                q: "Что значит «bite the bullet»?",
                options: ["Укусить пулю", "Стиснуть зубы и вытерпеть", "Стрелять из пистолета"],
                correct: 1
            },
            {
                q: "«Let the cat out of the bag» — это…",
                options: ["Выпустить кота", "Выдать секрет", "Сделать глупость"],
                correct: 1
            },
            {
                q: "«It costs an arm and a leg» значит…",
                options: ["Очень дорого", "Очень больно", "Очень дёшево"],
                correct: 0
            },
            {
                q: "«Let's call it a day» переводится как…",
                options: ["Назовём это днём", "Закончим на сегодня", "Позвоним днём"],
                correct: 1
            },
            {
                q: "«We see eye to eye» означает…",
                options: ["Смотрим друг другу в глаза", "Полностью согласны", "Ссоримся"],
                correct: 1
            }
        ];

        const formEl = document.getElementById("quizForm");

        questions.forEach((item, i) => {
            const fs = document.createElement("fieldset");
            const legend = document.createElement("legend");
            legend.textContent = `${i + 1}. ${item.q}`;
            fs.appendChild(legend);

            item.options.forEach((opt, j) => {
                const label = document.createElement("label");
                label.className = "option";
                label.innerHTML = `<input type="radio" name="q${i}" value="${j}" required> <span>${opt}</span>`;
                fs.appendChild(label);
            });
            formEl.appendChild(fs);
        });

        formEl.addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const resultEl = document.getElementById("result");
            const nameInput = document.getElementById("studentName");

            if (!nameInput.value.trim()) {
                resultEl.className = "error";
                resultEl.textContent = "Пожалуйста, введите имя.";
                return;
            }

            const formData = new FormData(formEl);
            let score = 0;
            const answers = questions.map((item, i) => {
                const selected = Number(formData.get(`q${i}`));
                const isCorrect = selected === item.correct;
                if (isCorrect) score++;
                return {
                    question: item.q,
                    selected: item.options[selected],
                    correct: isCorrect
                };
            });

            const payload = {
                name: nameInput.value.trim(),
                score: score,
                total: questions.length,
                answers: answers
            };

            btn.disabled = true;
            btn.textContent = "Отправка…";

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                resultEl.className = "success";
                resultEl.textContent = `Ваш результат: ${score} из ${questions.length}. Данные отправлены.`;
                btn.textContent = "Тест завершён";
            } catch (err) {
                resultEl.className = "error";
                resultEl.textContent = "Не удалось отправить. Проверьте интернет и попробуйте ещё раз.";
                btn.disabled = false;
                btn.textContent = "Попробовать снова";
            }
        });
    </script>
</body>
</html>
